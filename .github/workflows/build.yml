name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ha_link
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/healtrap/ha-link-addon/ha_link-${{ matrix.arch }}:${{ github.sha }}
            ghcr.io/healtrap/ha-link-addon/ha_link-${{ matrix.arch }}:latest
