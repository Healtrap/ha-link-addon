name: build

on:
  workflow_dispatch:
  push:
    branches:
      - next

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Lint (manifest, shell, tests)
        run: |
          set -e
          python3 -m pip install --quiet pyyaml wsgidav cheroot
          python3 tools/validate_manifest.py ha_link/config.yaml ha_control/config.yaml
          python3 tools/test_validate_manifest.py
          python3 tools/test_files_health.py
          python3 tools/test_watchdog_flag.py
          python3 tools/test_selfheal.py
          for f in $(find . -name '*.sh' -not -path './.git/*'); do
            echo "sh -n $f"; sh -n "$f"
          done

      - name: Read add-on version
        id: ver
        run: |
          v=$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' ha_link/config.yaml | head -1)
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "add-on version: $v"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ha_link
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/healtrap/ha-link-addon/ha_link-${{ matrix.arch }}:${{ steps.ver.outputs.value }}
            ghcr.io/healtrap/ha-link-addon/ha_link-${{ matrix.arch }}:latest
            ghcr.io/healtrap/ha-link-addon/ha_link-${{ matrix.arch }}:${{ github.sha }}
