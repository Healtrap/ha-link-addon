name: build-control

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: ver
        run: |
          v=$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' ha_control/config.yaml | head -1)
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "add-on version: $v"

      - name: Verify VERSION constant matches manifest
        run: |
          v="${{ steps.ver.outputs.value }}"
          c=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' ha_control/control_server.py | head -1)
          echo "manifest: $v / code: $c"
          if [ "$v" != "$c" ]; then
            echo "::error::VERSION in control_server.py ($c) != version in config.yaml ($v)"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ha_control
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/healtrap/ha-link-addon/ha_control-${{ matrix.arch }}:${{ steps.ver.outputs.value }}
            ghcr.io/healtrap/ha-link-addon/ha_control-${{ matrix.arch }}:latest
            ghcr.io/healtrap/ha-link-addon/ha_control-${{ matrix.arch }}:${{ github.sha }}
