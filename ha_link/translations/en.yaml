configuration:
  config_url:
    name: Endpoint URL
    description: URL of agent.json with the current relay address.
  relay_token:
    name: Relay token
    description: FRP auth token (same as auth.token in frps.toml).
  check_interval:
    name: Check interval (seconds)
    description: How often to re-read agent.json. 0 = only at startup. Minimum 30.
  files_token:
    name: Files access token
    description: Password for the remote file manager and WebDAV. Empty = file service disabled.
  files_domain:
    name: Files domain
    description: Public host name for the file service (must point to the relay VPS).
  ssh_port:
    name: SSH port on relay
    description: >-
      Port on the VPS for emergency SSH access to this host (e.g. 2222).
      0 = disabled. The port must be opened on the VPS in ufw.
  ssh_local_port:
    name: Local SSH port
    description: SSH port on Home Assistant itself (Advanced SSH add-on). Usually 22.
