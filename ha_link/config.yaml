name: HA Link
version: "0.3.0"
slug: ha_link
description: Dynamic FRP client with endpoint discovery + remote file access
url: https://virvinsky.ru/ha/
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
dns:
  - 1.1.1.1
  - 8.8.8.8
image: ghcr.io/healtrap/ha-link-addon/ha_link-{arch}
map:
  - config:rw
  - share:rw
  - addons:rw
options:
  config_url: https://virvinsky.ru/ha/agent.json
  relay_token: ""
  check_interval: 300
  files_token: ""
  files_domain: files.virvinsky.ru
  ssh_port: 0
  ssh_local_port: 22
  control_domain: ""
  control_slug: ha_control
  control_local_port: 8098
schema:
  config_url: str
  relay_token: password
  check_interval: int(0,86400)
  files_token: password
  files_domain: str
  ssh_port: port
  ssh_local_port: port
  control_domain: str
  control_slug: str
  control_local_port: port
