name: HA Link
version: "0.2.2"
slug: ha_link
description: Dynamic FRP client with endpoint discovery + remote file access
url: https://virvinsky.ru/ha/
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
image: ghcr.io/healtrap/ha-link-addon/ha_link-{arch}:1b9d60b0eb527381128b483a9aebe7ae0e7a5dc4
map:
  - config:rw
  - share:rw
  - addons:rw
options:
  config_url: https://virvinsky.ru/ha/agent.json
  relay_token: ""
  check_interval: 300
  files_token: ""
  files_domain: files.virvinsky.ru
schema:
  config_url: str
  relay_token: password
  check_interval: int(0,86400)
  files_token: password
  files_domain: str
